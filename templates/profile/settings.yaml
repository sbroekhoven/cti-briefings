# Profile settings (created from templates/profile by --init). Data paths (database, briefs_dir, backups_dir,
# a relative markdown.dir) are relative to the data dir: <profile>/data by default, see --where. Other paths
# (prompt) are relative to this profile folder.
# General settings. Secrets never go here: reference environment variable names (loaded from .env).

general:
  lookback_hours: 24            # how far back to look for items
  timezone: Europe/Amsterdam    # used for display and brief filenames
  log_level: INFO
  http_timeout_seconds: 20
  user_agent: "Mozilla/5.0 (compatible; cti-brief/0.2)"   # identify yourself, e.g. add "; +https://your.site"
  max_workers: 8                # sources fetched in parallel
  summary_max_chars: 600        # summaries are truncated, full articles are never stored
  backup_keep: 14               # copies of intel.db kept in paths.backups_dir (one per real run)
  retention_days: 180           # forget items older than this (never less than dedup.history_days); 0 = keep all

paths:
  database: intel.db
  briefs_dir: briefs
  backups_dir: backups
  brief_formats: [html, md]     # any of: html, md (one file per format, from src/templates/brief.<fmt>.j2)
  prompt: prompt.md

# Markdown output (briefs with paths.brief_formats containing md, and --history reviews).
markdown:
  dir: null   # folder for .md files. null = paths.briefs_dir.
                                # Dry-run previews are HTML only (in paths.briefs_dir), never Markdown.
  # Note names, without .md. Placeholders: {date} (2026-10-09), {time} (0700), {stamp} (20261009_070012).
  # A second run on the same day gets " {time}" appended instead of overwriting.
  brief_filename: "CTI Brief {date} {time}"
  review_filename: "CTI Review {date}"
  frontmatter: true             # YAML properties at the top (date, counts, severity, CVEs, tags) for Obsidian
  tags: [cti, cti-brief]        # brief tags; reviews get these plus cti-review

# score = trust * trust_weight + category_bonus + keyword points (gating.yaml) + recency + source bonus, clamped 0..100
scoring:
  trust_weight: 0.35
  title_multiplier: 1.5         # a keyword hit in the title counts 1.5x
  recency_max: 10               # newest items get up to this many points
  category_bonus:
    government: 15
    vulnerability_db: 10
    vendor: 3
    news: 0
    community: 0
    search: -3

limits:
  min_score: 40                 # "quiet" threshold: higher = quieter brief, lower = noisier.
                                # Rough guide: a trusted source with no keyword hit scores about 35.
  max_candidates_to_llm: 60     # top-scoring items sent to the LLM
  max_items_reported: 15        # hard cap on ACT + SIGNAL in the brief (the vulnerability table is separate)
  act_max: 5                    # max ACT items (the rest of the cap is available to SIGNAL)
  send_empty_brief: false       # if nothing new, skip LLM call and delivery

# Items from sources with section: vulnerabilities (sources.yaml) are ranked separately and shown as a
# table in the brief, built without the LLM. They never take news ACT/SIGNAL slots.
vulnerabilities:
  min_score: 40                 # quiet threshold for the table (same scale as limits.min_score)
  max_items: 15                 # rows in the Vulnerabilities table
  to_llm: 5                     # top rows also shown to the LLM, which may promote one to ACT (0 = never)
  require_match: true           # only list vulnerabilities that hit one of match_groups (gating.yaml) ...
  match_groups: [organization, stack]
  exploited_always: true        # ... or that are known exploited (CISA KEV, ENISA exploited feed)

dedup:
  title_similarity: 80          # 0..100, fuzzy title match. Higher = stricter (fewer merges)
  history_days: 30              # how far back to compare against already-seen items

llm:
  engine: claude_code
  engines:
    claude_code:
      binary: claude # use an absolute path when running from cron
      model: opus               # e.g. sonnet; null uses your Claude Code default
      timeout_seconds: 300
      retries: 1                # one retry when the reply is not valid JSON
      cwd: null                 # working directory for the call (null = an empty temporary directory)
      # Story text is untrusted internet content. By default the call runs with no tools, no MCP servers and
      # in an empty temp dir, so an injected instruction cannot read .env or use connectors.
      allow_tools: false        # true removes --tools "" and --strict-mcp-config (not recommended)
      extra_args: []

delivery:
  # The HTML file in briefs/ is always written. These are extra channels.
  email:
    enabled: false
    smtp_host: smtp.gmail.com   # Gmail needs an app password (2FA account)
    smtp_port: 587
    security: starttls          # starttls | ssl (port 465) | none
    username: you@example.com
    password_env: SMTP_PASSWORD
    from: you@example.com
    to:
      - security-team@example.com
      - you@example.com
      - team@example.com
    subject: "CTI Brief {date} ({act} act, {signal} signal)"
  teams:
    enabled: false
    webhook_env: TEAMS_WEBHOOK_URL   # Teams Workflows webhook URL, kept in .env
    max_act_items: 5
    max_signal_items: 8
    max_vuln_items: 5
