[project]
name = "cti-brief"
version = "0.2.0"
description = "Modular cyber threat intelligence collector and daily brief generator"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
